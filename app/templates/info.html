{% extends "base.html" %}
{% block title %}信息库{% endblock %}
{% block content %}
<style>
.search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}
.search-box input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box button {
    padding: 10px 20px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
}
.search-box button:hover { background: #1d4ed8; }
.cat-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e2e8f0;
}
.cat-tab {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #f1f5f9;
    color: var(--text-light);
    border: 1px solid transparent;
    transition: all 0.15s;
}
.cat-tab:hover { background: #e2e8f0; color: var(--text); }
.cat-tab.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}
.info-card {
    padding: 16px 0;
    border-bottom: 1px solid #e2e8f0;
}
.info-card:last-child { border-bottom: none; }
.info-cat-badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1e40af;
    margin-bottom: 8px;
}
.search-hint {
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 12px;
}
</style>

<div class="card">
    <h2 class="title">📚 分类信息库</h2>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索关键词，如：考研、医保、合同..." onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">🔍 搜索</button>
    </div>

    <div class="cat-tabs" id="cat-tabs">
        <span class="cat-tab active" data-cat="" onclick="selectCategory('')">全部</span>
        <span class="cat-tab" data-cat="生活常识" onclick="selectCategory('生活常识')">生活常识</span>
        <span class="cat-tab" data-cat="升学就业" onclick="selectCategory('升学就业')">升学就业</span>
        <span class="cat-tab" data-cat="法律知识" onclick="selectCategory('法律知识')">法律知识</span>
        <span class="cat-tab" data-cat="创业资讯" onclick="selectCategory('创业资讯')">创业资讯</span>
    </div>

    <div id="info_list">
        <p style="color: var(--text-light); text-align: center; padding: 40px;">正在加载...</p>
    </div>
</div>

<script>
function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let currentCat = '';

function selectCategory(cat) {
    currentCat = cat;
    // 搜索框清空
    document.getElementById('search-input').value = '';
    // 切换 tab 高亮
    document.querySelectorAll('.cat-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.cat === cat);
    });
    loadInfo(cat, '');
}

function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    // 搜索时取消分类高亮
    document.querySelectorAll('.cat-tab').forEach(el => el.classList.remove('active'));
    loadInfo(currentCat, q);
}

function loadInfo(cat, q) {
    let url = '/api/info';
    const params = [];
    if (cat) params.push(`category=${encodeURIComponent(cat)}`);
    if (q) params.push(`q=${encodeURIComponent(q)}`);
    if (params.length) url += '?' + params.join('&');

    const list = document.getElementById('info_list');
    list.innerHTML = '<p style="color: var(--text-light); text-align: center; padding: 40px;">正在加载...</p>';

    api.get(url, d => {
        if (d.code === 200 && d.data.length > 0) {
            const hint = q
                ? `<div class="search-hint">🔎 搜索 "<strong>${escapeHtml(q)}</strong>" 找到 ${d.data.length} 条结果</div>`
                : (cat ? `<div class="search-hint">📂 ${escapeHtml(cat)} 分类，共 ${d.data.length} 条</div>` : '');
            list.innerHTML = hint + d.data.map(item => `
                <div class="info-card">
                    <span class="info-cat-badge">${escapeHtml(item.category || '未分类')}</span>
                    <h3 style="margin-bottom:6px;">${escapeHtml(item.title)}</h3>
                    <p style="color:var(--text);line-height:1.7;">${escapeHtml(item.content)}</p>
                </div>
            `).join('');
        } else if (d.code === 200) {
            const msg = q
                ? `未找到与 "${escapeHtml(q)}" 相关的信息，试试其他关键词`
                : '该分类下暂无信息';
            list.innerHTML = `<p style="color: var(--text-light); text-align: center; padding: 40px;">${msg}</p>`;
        } else {
            list.innerHTML = `<p style="color:#ef4444; text-align: center; padding: 40px;">加载失败</p>`;
        }
    }, false);
}

// 从 URL 参数初始化（支持从首页 pill 跳转）
// 用 load 事件确保 base.html 的 api 对象已定义
window.addEventListener('load', function() {
    const params = new URLSearchParams(location.search);
    const initCat = params.get('category') || '';
    const initQ = params.get('q') || '';
    if (initQ) {
        document.getElementById('search-input').value = initQ;
        loadInfo(initCat, initQ);
    } else if (initCat) {
        selectCategory(initCat);
    } else {
        loadInfo('', '');
    }
});
</script>
{% endblock %}
