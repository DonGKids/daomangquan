{% extends "base.html" %}
{% block title %}信息库{% endblock %}
{% block content %}
<style>
.search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}
.search-box input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box button {
    padding: 10px 20px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
}
.search-box button:hover { background: #1d4ed8; }
.cat-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e2e8f0;
}
.cat-tab {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #f1f5f9;
    color: var(--text-light);
    border: 1px solid transparent;
    transition: all 0.15s;
}
.cat-tab:hover { background: #e2e8f0; color: var(--text); }
.cat-tab.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}
.info-card {
    padding: 16px 0;
    border-bottom: 1px solid #e2e8f0;
}
.info-card:last-child { border-bottom: none; }
.info-cat-badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1e40af;
    margin-bottom: 8px;
}
.search-hint {
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 12px;
}
</style>

<div class="card">
    <h2 class="title">📚 分类信息库</h2>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索关键词，如：考研、医保、合同..." onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">🔍 搜索</button>
    </div>

    <div class="cat-tabs" id="cat-tabs">
        <span class="cat-tab active" data-cat="" onclick="selectCategory('')">全部</span>
        <span class="cat-tab" data-cat="生活常识" onclick="selectCategory('生活常识')">生活常识</span>
        <span class="cat-tab" data-cat="升学就业" onclick="selectCategory('升学就业')">升学就业</span>
        <span class="cat-tab" data-cat="法律知识" onclick="selectCategory('法律知识')">法律知识</span>
        <span class="cat-tab" data-cat="创业资讯" onclick="selectCategory('创业资讯')">创业资讯</span>
    </div>

    <div id="info_list">
        <p style="color: var(--text-light); text-align: center; padding: 40px;">正在加载...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/info.js') }}"></script>
{% endblock %}
