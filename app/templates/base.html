<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}导茫犬 - 大学生扫茫平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <h2>🐾 导茫犬 · 大学生扫茫信息平台</h2>
        <div class="nav">
            <a href="/">首页</a>
            <a href="/info">信息库</a>
            <a href="/forum">互助论坛</a>
            {% if session.user_id %}
                <a href="/maze">迷茫检测</a>
                <a href="/profile">个人中心</a>
                {% if session.is_admin %}
                    <a href="/admin" style="color:#fde68a;">管理后台</a>
                {% endif %}
            {% else %}
                <a href="/login">登录</a>
                <a href="/register">注册</a>
            {% endif %}
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
