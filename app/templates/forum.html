{% extends "base.html" %}
{% block title %}互助论坛{% endblock %}
{% block content %}
<div class="card">
    <h2 class="title">💬 互助论坛</h2>
    {% if session.user_id %}
    <input id="title" placeholder="帖子标题（必填，最多100字）">
    <textarea id="content" rows="4" placeholder="分享你的问题或经验（必填，最多1000字）"></textarea>
    <button class="btn" onclick="submitPost()">发布帖子</button>
    {% else %}
    <p style="color: var(--text-light);">登录后即可发布帖子，和同学一起交流。</p>
    {% endif %}
</div>

<div class="card">
    <h3 class="title">📋 帖子列表 <span id="post-count" style="color:var(--text-light);font-size:14px;font-weight:normal;"></span></h3>
    <div id="post_list">
        <p style="color: var(--text-light); text-align: center; padding: 40px;">正在加载...</p>
    </div>
    <div id="pagination" style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap;"></div>
</div>

<script>
const CURRENT_USER_ID = {{ session.user_id if session.user_id else 'null' }};
let CURRENT_PAGE = 1;
const PAGE_LIMIT = 10;

function loadPosts(page) {
    page = page || 1;
    CURRENT_PAGE = page;
    api.get(`/api/posts?page=${page}&limit=${PAGE_LIMIT}`, d => {
        if (d.code === 200 && d.data.length > 0) {
            document.getElementById('post-count').textContent = `（共 ${d.total} 篇）`;
            let html = '';
            d.data.forEach(p => {
                const replies = p.reply_count || 0;
                const time = (p.create_time || '未知').substring(0, 10);
                const delBtn = (CURRENT_USER_ID && p.user_id === CURRENT_USER_ID)
                    ? `<button onclick="event.stopPropagation();deletePostFromList(${p.id},this)" style="float:right;border:1px solid #ef4444;border-radius:6px;background:white;color:#ef4444;padding:2px 10px;font-size:12px;cursor:pointer;">🗑️</button>`
                    : '';
                html += `
                <div class="list-item" style="cursor:pointer;" onclick="location.href='/post/${p.id}'">
                    ${delBtn}
                    <h3>${escapeHtml(p.title)}</h3>
                    <p>${escapeHtml(p.content.length > 80 ? p.content.substring(0, 80) + '...' : p.content)}</p>
                    <small style="color: var(--text-light);">
                        👤 ${escapeHtml(p.author)} · 🕒 ${time} · 💬 ${replies} 条评论 · ❤️ ${p.like_count || 0} 赞
                    </small>
                </div>`;
            });
            document.getElementById('post_list').innerHTML = html;
            renderPagination(d.page, d.total_pages);
        } else if (d.code === 200) {
            document.getElementById('post-count').textContent = '';
            document.getElementById('post_list').innerHTML = '<p style="color: var(--text-light); text-align: center; padding: 40px;">暂无帖子，发表第一篇吧！</p>';
            document.getElementById('pagination').innerHTML = '';
        } else {
            document.getElementById('post_list').innerHTML = '<p style="color:#ef4444; text-align: center; padding: 40px;">加载失败</p>';
            document.getElementById('pagination').innerHTML = '';
        }
    }, false);
}

function renderPagination(current, total) {
    if (total <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    let html = '';
    const btnStyle = 'padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px;background:white;cursor:pointer;font-size:13px;';
    const activeStyle = 'padding:6px 12px;border:1px solid var(--primary);border-radius:6px;background:var(--primary);color:white;cursor:pointer;font-size:13px;';
    const disabledStyle = 'padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc;color:#cbd5e1;cursor:not-allowed;font-size:13px;';

    // 上一页
    if (current > 1) {
        html += `<button style="${btnStyle}" onclick="loadPosts(${current - 1})">上一页</button>`;
    } else {
        html += `<button style="${disabledStyle}" disabled>上一页</button>`;
    }

    // 页码（显示最多 7 个，当前页附近）
    let start = Math.max(1, current - 3);
    let end = Math.min(total, start + 6);
    if (end - start < 6) start = Math.max(1, end - 6);
    if (start > 1) {
        html += `<button style="${btnStyle}" onclick="loadPosts(1)">1</button>`;
        if (start > 2) html += '<span style="color:var(--text-light);">...</span>';
    }
    for (let i = start; i <= end; i++) {
        if (i === current) {
            html += `<button style="${activeStyle}" disabled>${i}</button>`;
        } else {
            html += `<button style="${btnStyle}" onclick="loadPosts(${i})">${i}</button>`;
        }
    }
    if (end < total) {
        if (end < total - 1) html += '<span style="color:var(--text-light);">...</span>';
        html += `<button style="${btnStyle}" onclick="loadPosts(${total})">${total}</button>`;
    }

    // 下一页
    if (current < total) {
        html += `<button style="${btnStyle}" onclick="loadPosts(${current + 1})">下一页</button>`;
    } else {
        html += `<button style="${disabledStyle}" disabled>下一页</button>`;
    }
    document.getElementById('pagination').innerHTML = html;
}

function deletePostFromList(postId, btn) {
    if (!confirm('确定删除这篇帖子吗？删除后无法恢复，相关评论和点赞也会一并删除。')) return;
    api.post(`/api/posts/${postId}/delete`, {}, d => {
        if (d.code === 200) {
            showToast('删除成功', 'success');
            loadPosts(CURRENT_PAGE);
        } else {
            showToast(d.msg, 'error');
        }
    });
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function validatePost() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();

    if (!title) {
        showToast('请输入帖子标题', 'error');
        return false;
    }
    if (title.length > 100) {
        showToast('帖子标题不能超过100字', 'error');
        return false;
    }
    if (!content) {
        showToast('请输入帖子内容', 'error');
        return false;
    }
    if (content.length > 1000) {
        showToast('帖子内容不能超过1000字', 'error');
        return false;
    }
    return true;
}

function submitPost() {
    if (!validatePost()) return;

    api.post('/api/post', {
        title: document.getElementById('title').value.trim(),
        content: document.getElementById('content').value.trim()
    }, d => {
        if (d.code === 200) {
            showToast('发布成功！', 'success');
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            loadPosts(1);
        } else {
            showToast(d.msg, 'error');
        }
    });
}

window.addEventListener('load', function() { loadPosts(); });
</script>
{% endblock %}
