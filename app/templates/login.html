{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 40px auto;">
    <h2 class="title">🔐 用户登录</h2>
    <input id="username" placeholder="请输入用户名（3-20个字符）">
    <input id="password" type="password" placeholder="请输入密码（至少6个字符）">
    <button class="btn" style="width: 100%;" onclick="login()">登录</button>
    <p style="text-align: center; margin-top: 16px; color: var(--text-light);">
        还没有账号？<a href="/register" style="color: var(--primary); text-decoration: none;">立即注册</a>
    </p>
</div>
<script>
function validateForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username) {
        showToast('请输入用户名', 'error');
        return false;
    }
    if (username.length < 3 || username.length > 20) {
        showToast('用户名长度必须在3-20个字符之间', 'error');
        return false;
    }
    if (!password) {
        showToast('请输入密码', 'error');
        return false;
    }
    if (password.length < 6) {
        showToast('密码长度至少6个字符', 'error');
        return false;
    }
    return true;
}

function login() {
    if (!validateForm()) return;

    api.post('/login', {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
    }, d => {
        if (d.code === 200) {
            showToast('登录成功！', 'success');
            setTimeout(() => location.href = '/', 500);
        } else {
            showToast(d.msg, 'error');
        }
    });
}

document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});
</script>
{% endblock %}
