{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 40px auto;">
    <h2 class="title">📝 用户注册</h2>
    <input id="username" placeholder="请输入用户名（3-20个字符，仅中文、英文、数字和下划线）">
    <input id="password" type="password" placeholder="请输入密码（至少6个字符）">
    <input id="password2" type="password" placeholder="请确认密码">
    <input id="student_id" placeholder="请输入学号（可选）">
    <input id="college" placeholder="请输入学院（可选）">
    <input id="major" placeholder="请输入专业（可选）">
    <button class="btn" style="width: 100%;" onclick="register()">注册</button>
    <p style="text-align: center; margin-top: 16px; color: var(--text-light);">
        已有账号？<a href="/login" style="color: var(--primary); text-decoration: none;">立即登录</a>
    </p>
</div>
<script>
function validateForm() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (!username) {
        showToast('请输入用户名', 'error');
        return false;
    }
    if (username.length < 3 || username.length > 20) {
        showToast('用户名长度必须在3-20个字符之间', 'error');
        return false;
    }
    if (!/^[\u4e00-\u9fa5a-zA-Z0-9_]+$/.test(username)) {
        showToast('用户名只能包含中文、英文、数字和下划线', 'error');
        return false;
    }
    if (!password) {
        showToast('请输入密码', 'error');
        return false;
    }
    if (password.length < 6) {
        showToast('密码长度至少6个字符', 'error');
        return false;
    }
    if (password !== password2) {
        showToast('两次输入的密码不一致', 'error');
        return false;
    }
    return true;
}

function register() {
    if (!validateForm()) return;

    api.post('/register', {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        student_id: document.getElementById('student_id').value.trim(),
        college: document.getElementById('college').value.trim(),
        major: document.getElementById('major').value.trim()
    }, d => {
        if (d.code === 200) {
            showToast('注册成功！', 'success');
            setTimeout(() => location.href = '/login', 500);
        } else {
            showToast(d.msg, 'error');
        }
    });
}
</script>
{% endblock %}
