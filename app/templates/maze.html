{% extends "base.html" %}
{% block title %}迷茫检测{% endblock %}
{% block content %}
<div class="card">
    <h2 class="title">🔍 迷茫检测</h2>
    <p style="color: var(--text-light); margin-bottom: 16px;">
        描述你的困惑（学习/就业/生活/人际），系统将提取关键词并为你生成个性化信息推荐。
    </p>
    <textarea id="content" rows="6" placeholder="请输入你的困惑...
例如：最近要考研，感觉很焦虑，不知道怎么准备面试和投简历"></textarea>
    <button class="btn" onclick="detect()">提交检测</button>
</div>

<div id="result" style="display:none;">
    <div class="card">
        <h2 class="title">📋 检测报告</h2>
        <div id="kw-section"></div>
    </div>
    <div id="rec-section"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/maze.js') }}"></script>
{% endblock %}
